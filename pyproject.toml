[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-mediaremote-python"
version = "0.1.0a1"
description = "Unofficial asyncio wrapper for ungive/mediaremote-adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Mai-icy/macos-mediaremote-python"
Repository = "https://github.com/Mai-icy/macos-mediaremote-python"
Issues = "https://github.com/Mai-icy/macos-mediaremote-python/issues"
Documentation = "https://github.com/Mai-icy/macos-mediaremote-python#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macos_mediaremote = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
